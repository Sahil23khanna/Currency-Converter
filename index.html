<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">

<body>
    <div class="container">
        <div class="converter-card">
            <div class="header">
                <h1>💱 Currency Converter</h1>
                <p>Convert currencies in real-time</p>
            </div>

                <div class="input-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" value="" min="0" step="0.01">
                </div>

                    <div class="currency-group">
                        <label for="fromCurrency">From</label>

                            <option value="SEK">SEK - Swedish Krona</option>
                            <option value="NOK">NOK - Norwegian Krone</option>
                            <option value="DKK">DKK - Danish Krone</option>
                            <option value="ILS">ILS - Israeli Shekel</option>
                            <option value="EGP">EGP - Egyptian Pound</option>
                            <option value="PKR">PKR - Pakistani Rupee</option>
                            <option value="BDT">BDT - Bangladeshi Taka</option>

                        </select>
                    </div>

                        </select>
                    </div>
                </div>
                
                <button id="convertBtn" class="convert-btn">Convert</button>
                
                <div class="result-container">
                    <div class="result" id="result">
                        <span class="result-label">Result:</span>
                        <span class="result-value" id="resultValue">-</span>
                    </div>
                    <div class="exchange-rate" id="exchangeRate"></div>
                </div>

            </div>
        </div>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
